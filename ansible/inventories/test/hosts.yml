all:
  vars:
    jboss_home: /opt/jboss-eap
    jboss_instance_user: jboss
    ansible_host: localhost
    ansible_user: root
    ansible_ssh_pass: testpass123
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
  children:
    nord:
      vars:
        region_name: NORD
      hosts:
        jb-nord-04.steg.tn:
          ansible_port: 2222
        jb-nord-05.steg.tn:
          ansible_port: 2223
    sud:
      vars:
        region_name: SUD
      hosts:
        jb-sud-01.steg.tn:
          ansible_port: 2224
